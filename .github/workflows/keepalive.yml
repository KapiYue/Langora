# Query the production database three times daily.
# Successful queries do not guarantee exemption from Supabase inactivity pausing.
name: Supabase Keepalive

on:
  schedule:
    # UTC 00:17, 08:17, 16:17 = 北京时间 08:17、16:17、00:17。
    - cron: '17 0,8,16 * * *'
  workflow_dispatch:

# 默认的 GITHUB_TOKEN 只有读权限，推心跳需要写。
permissions:
  contents: write

# 保活是幂等的，两次运行叠在一起没意义，后来的排队等前一个跑完即可。
concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        # persist-credentials 默认为 true，后面的 git push 直接复用这份凭据。

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # 只需要 tsx / dotenv / drizzle-orm / postgres，但用 lockfile 装全套最省心也最稳定。
      - name: Install dependencies
        run: npm ci

      # 在只读事务中查询真实业务表，并校验连接属于预期项目。
      - name: Read production database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run keepalive

      # 让定时任务自己不被 GitHub 禁用：每次运行都往 keepalive 分支推一个只含
      # HEARTBEAT 文件的孤儿提交（无 parent），强推覆盖，所以分支永远只有一个提交，
      # 既不污染 main 的历史，也不会越堆越大。
      # 用 git 底层命令直接造对象，不碰工作区，也不需要额外 checkout。
      # 注意：用 GITHUB_TOKEN 推送不会触发其他 workflow，不会造成递归。
      #
      # if: always() —— 上面连数据库那步失败时，这步照样要跑：DB 挂了是一回事，
      # 定时任务被 GitHub 禁用（连重试机会都没有）是更糟的另一回事。
      - name: Heartbeat
        if: always()
        env:
          GIT_AUTHOR_NAME: 'github-actions[bot]'
          GIT_AUTHOR_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
          GIT_COMMITTER_NAME: 'github-actions[bot]'
          GIT_COMMITTER_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
        run: |
          set -euo pipefail
          now=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          cat > "$RUNNER_TEMP/HEARTBEAT" <<EOF
          last heartbeat : ${now}
          main commit    : ${GITHUB_SHA}
          run            : ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF

          # 这个分支是孤儿分支，只有一个 HEARTBEAT 文件，没有 package.json。
          # Vercel 默认给每个分支都建 preview 部署，于是每次心跳都会失败一次
          # （No Next.js version detected）。带上 vercel.json 明确关掉这个分支的部署。
          cat > "$RUNNER_TEMP/vercel.json" <<'EOF'
          {
            "git": {
              "deploymentEnabled": {
                "keepalive": false
              }
            }
          }
          EOF

          # blob -> tree（权限 100644）-> commit（不带 -p，即孤儿提交）
          blob=$(git hash-object -w "$RUNNER_TEMP/HEARTBEAT")
          vercel_blob=$(git hash-object -w "$RUNNER_TEMP/vercel.json")
          tree=$(printf '100644 blob %s\tHEARTBEAT\n100644 blob %s\tvercel.json\n' \
            "$blob" "$vercel_blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "chore: keepalive heartbeat ${now}")

          git push --force origin "${commit}:refs/heads/keepalive"
          echo "心跳已推送：${commit}"
