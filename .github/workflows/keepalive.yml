# 双重保活：
#   1) Supabase 免费版 7 天无数据库活动就会暂停项目（整站挂掉、Creem webhook 丢失），
#      所以定时执行一次 `select now()`。
#   2) GitHub 会把「仓库 60 天没有任何活动」的 schedule 工作流自动禁用 —— 也就是说
#      保活任务自己会先死。所以每次运行都往 keepalive 孤儿分支推一次心跳，
#      产生 push 活动重置 60 天倒计时。
name: Keepalive

on:
  schedule:
    # cron 五个字段：分 时 日 月 星期，时区固定 UTC（不是北京时间）。
    #   17   -> 第 17 分钟（刻意避开整点：GitHub 官方说明 schedule 在每小时
    #           开头负载最高，排队任务可能被延迟甚至丢弃）
    #   3    -> UTC 3 点，即 UTC 03:17 = 北京时间 11:17
    #   */2  -> 每隔 2 天（1、3、5…29 号，跨月时会有一次间隔变化）
    #   * *  -> 每个月、每个星期几都算
    # 即每两天跑一次。Supabase 是 7 天才休眠，2 天一次留了足够余量，
    # 连续失败两三次也不至于出事。
    - cron: '17 3 */2 * *'
    - cron: '43 15 */2 * *'   # UTC 15:43 = 北京时间 23:43
  workflow_dispatch:

# 默认的 GITHUB_TOKEN 只有读权限，推心跳需要写。
permissions:
  contents: write

# 保活是幂等的，两次运行叠在一起没意义，后来的排队等前一个跑完即可。
concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        # persist-credentials 默认为 true，后面的 git push 直接复用这份凭据。

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # 只需要 tsx / dotenv / drizzle-orm / postgres，但用 lockfile 装全套最省心也最稳定。
      - name: Install dependencies
        run: npm ci

      # 真正干活的一步：连一次数据库。脚本里 `select now()` 成功就打印时间，
      # 失败 exit 1 让这次运行标红（记得在仓库 Settings 里开启失败邮件通知）。
      - name: Touch Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_OR_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_OR_ANON_KEY }}
        run: npm run keepalive

      # 让定时任务自己不被 GitHub 禁用：每次运行都往 keepalive 分支推一个只含
      # HEARTBEAT 文件的孤儿提交（无 parent），强推覆盖，所以分支永远只有一个提交，
      # 既不污染 main 的历史，也不会越堆越大。
      # 用 git 底层命令直接造对象，不碰工作区，也不需要额外 checkout。
      # 注意：用 GITHUB_TOKEN 推送不会触发其他 workflow，不会造成递归。
      #
      # if: always() —— 上面连数据库那步失败时，这步照样要跑：DB 挂了是一回事，
      # 定时任务被 GitHub 禁用（连重试机会都没有）是更糟的另一回事。
      - name: Heartbeat
        if: always()
        env:
          GIT_AUTHOR_NAME: 'github-actions[bot]'
          GIT_AUTHOR_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
          GIT_COMMITTER_NAME: 'github-actions[bot]'
          GIT_COMMITTER_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
        run: |
          set -euo pipefail
          now=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          cat > "$RUNNER_TEMP/HEARTBEAT" <<EOF
          last heartbeat : ${now}
          main commit    : ${GITHUB_SHA}
          run            : ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF

          # 这个分支是孤儿分支，只有一个 HEARTBEAT 文件，没有 package.json。
          # Vercel 默认给每个分支都建 preview 部署，于是每次心跳都会失败一次
          # （No Next.js version detected）。带上 vercel.json 明确关掉这个分支的部署。
          cat > "$RUNNER_TEMP/vercel.json" <<'EOF'
          {
            "git": {
              "deploymentEnabled": {
                "keepalive": false
              }
            }
          }
          EOF

          # blob -> tree（权限 100644）-> commit（不带 -p，即孤儿提交）
          blob=$(git hash-object -w "$RUNNER_TEMP/HEARTBEAT")
          vercel_blob=$(git hash-object -w "$RUNNER_TEMP/vercel.json")
          tree=$(printf '100644 blob %s\tHEARTBEAT\n100644 blob %s\tvercel.json\n' \
            "$blob" "$vercel_blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "chore: keepalive heartbeat ${now}")

          git push --force origin "${commit}:refs/heads/keepalive"
          echo "心跳已推送：${commit}"
