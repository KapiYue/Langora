# 双重保活：
#   1) Supabase 免费版 7 天无数据库活动就会暂停项目（整站挂掉、Creem webhook 丢失），
#      所以定时执行一次 `select now()`。
#   2) GitHub 会把「仓库 60 天没有任何活动」的 schedule 工作流自动禁用 —— 也就是说
#      保活任务自己会先死。所以本工作流在仓库长期没提交时，会推一个空提交把自己续命。
name: Keepalive

on:
  schedule:
    # cron 五个字段：分 时 日 月 星期，时区固定 UTC（不是北京时间）。
    #   0    -> 第 0 分钟
    #   3    -> UTC 3:00 = 北京时间 11:00
    #   */2  -> 每隔 2 天（1、3、5…29 号，跨月时会有一次间隔变化）
    #   * *  -> 每个月、每个星期几都算
    # 即每两天跑一次。Supabase 是 7 天才休眠，2 天一次留了足够余量，
    # 连续失败两三次也不至于出事。
    - cron: '0 3 */2 * *'
  workflow_dispatch:
    inputs:
      force_commit:
        description: '强制推送一个空提交（用于手动重置 60 天倒计时）'
        type: boolean
        default: false

# 默认的 GITHUB_TOKEN 只有读权限，推空提交需要写。
permissions:
  contents: write

# 保活是幂等的，两次运行叠在一起没意义，后来的排队等前一个跑完即可。
concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # persist-credentials 默认为 true，后面的 git push 直接复用这份凭据。

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 只需要 tsx / dotenv / drizzle-orm / postgres，但用 lockfile 装全套最省心也最稳定。
      - name: Install dependencies
        run: npm ci

      # 真正干活的一步：连一次数据库。脚本里 `select now()` 成功就打印时间，
      # 失败 exit 1 让这次运行标红（记得在仓库 Settings 里开启失败邮件通知）。
      - name: Touch Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_OR_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_OR_ANON_KEY }}
        run: npm run keepalive

      # 让定时任务自己不被 GitHub 禁用：仓库超过 MAX_QUIET_DAYS 天没有新提交时，
      # 推一个空提交（不改任何文件，只产生一次 push 活动）重置 60 天倒计时。
      # 注意：用 GITHUB_TOKEN 推送不会触发其他 workflow，不会造成递归。
      - name: Keep this schedule enabled
        env:
          MAX_QUIET_DAYS: '45' # 留 15 天缓冲，够连续失败好几次
          FORCE: ${{ inputs.force_commit }}
        run: |
          set -euo pipefail
          last_commit=$(git log -1 --format=%ct)
          quiet_days=$(( ( $(date +%s) - last_commit ) / 86400 ))
          echo "距离上次提交：${quiet_days} 天（阈值 ${MAX_QUIET_DAYS} 天）"

          if [ "$FORCE" != "true" ] && [ "$quiet_days" -lt "$MAX_QUIET_DAYS" ]; then
            echo "仓库仍有活动，无需保活提交。"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m 'chore: keepalive（重置 GitHub 定时任务 60 天倒计时）'
          git push origin HEAD:${{ github.ref_name }}
          echo "已推送空提交。"
